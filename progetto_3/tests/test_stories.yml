version: "3.1"

stories:
- story: saluto e ricerca ricetta
  steps:
  - user: |
      ciao
    intent: greet
  - action: action_nuova_ricerca
  - action: utter_greet
  - user: |
      ho uova e zucchine
    intent: cerca_ricetta
    entities:
    - ingrediente: uova
    - ingrediente: zucchine
  - action: action_cerca_ricette

- story: ricerca e aggiunta ingrediente
  steps:
  - user: |
      vorrei un primo facile con zucchine
    intent: cerca_ricetta
    entities:
    - tipologia: primo
    - difficolta: facile
    - ingrediente: zucchine
  - action: action_cerca_ricette
  - user: |
      aggiungi anche carote
    intent: fornisce_ingredienti
    entities:
    - ingrediente: carote
  - action: action_cerca_ricette

- story: richiesta ricetta veloce
  steps:
  - user: |
      dammi una ricetta veloce con pollo
    intent: cerca_ricetta
    entities:
    - tempo_req: veloce
    - ingrediente: pollo
  - action: action_cerca_ricette

- story: ricetta casuale
  steps:
  - user: |
      sorprendimi
    intent: sorprendimi
  - action: action_sorprendimi

- story: avvio e avanzamento preparazione
  steps:
  - user: |
      /inizia_cucinare{"titolo_ricetta":"0"}
    intent: inizia_cucinare
    entities:
    - titolo_ricetta: "0"
  - action: action_inizia_cucinare
  - user: |
      /step_successivo
    intent: step_successivo
  - action: action_step_successivo

- story: fallback
  steps:
  - user: |
      asdfghjkl
    intent: nlu_fallback
  - action: action_smart_fallback

- story: ricerca ricetta per titolo
  steps:
  - user: |
      come si fa il pollo alla cacciatora
    intent: cerca_ricetta_titolo
    entities:
    - titolo_ricetta: pollo alla cacciatora
  - action: action_cerca_ricette

- story: esclusione esplicita
  steps:
  - user: |
      senza arachidi
    intent: escludi_ingrediente
    entities:
    - ingrediente_escluso: arachidi
  - action: action_cerca_ricette

- story: preferenza alimentare
  steps:
  - user: |
      sono vegano
    intent: imposta_preferenza
    entities:
    - preferenza_alimentare: vegano
  - action: action_cerca_ricette

- story: modalita flessibile
  steps:
  - user: |
      posso comprare uno o due ingredienti
    intent: imposta_modalita
    entities:
    - modalita_ricerca: uno o due ingredienti
  - action: action_cerca_ricette

- story: rifiuto ingrediente suggerito
  steps:
  - user: |
      no non ce l'ho
    intent: nega_ingrediente
  - action: action_cerca_ricette

- story: saluto finale
  steps:
  - user: |
      grazie mille
    intent: goodbye
  - action: utter_goodbye

- story: nuova ricerca
  steps:
  - user: |
      azzera tutto
    intent: nuova_ricerca
  - action: action_nuova_ricerca
  - action: utter_greet
