# The config recipe.
# https://rasa.com/docs/rasa/model-configuration/
recipe: default.v1

# The assistant project unique identifier
assistant_id: 20251207-113517-internal-land

# --- CAMBIO FONDAMENTALE: ITALIANO ---
language: it

pipeline:
  # Tokenizer: Divide le frasi in parole
  - name: WhitespaceTokenizer
  
  # Featurizers: Estraggono caratteristiche dal testo per il ML
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
    
  # Classifier: Il cervello che decide l'intent (cerca_ricetta, ecc.)
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
    
  # Mapper: Gestisce i sinonimi (es: uova = tuorli)
  - name: EntitySynonymMapper
  
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true
    
  # --- FALLBACK: GESTIONE "NON HO CAPITO" ---
  # Se la confidenza è sotto il 70% (0.7), attiva l'intent 'nlu_fallback'
  - name: FallbackClassifier
    threshold: 0.7
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
  
  # RulePolicy: Gestisce le regole fisse (come i bottoni o il fallback)
  - name: RulePolicy
    # Se il bot non sa che azione fare (confidenza < 40%), usa l'azione di default
    core_fallback_threshold: 0.4
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: True
    
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
    
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true